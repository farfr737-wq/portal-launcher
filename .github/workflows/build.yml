name: Build Portal Launcher

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        if: runner.os != 'Windows'
        run: chmod +x gradlew
      - name: Run tests (launcher + server)
        run: ./gradlew test --stacktrace

  windows:
    name: Windows EXE
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        if: runner.os != 'Windows'
        run: chmod +x gradlew
      - name: Build app-image (PortalLauncher.exe) and installer
        shell: pwsh
        run: ./gradlew createDistributable packageExe --stacktrace
      - name: Zip portable build
        shell: pwsh
        run: |
          Compress-Archive -Path build/compose/binaries/main/app/PortalLauncher -DestinationPath PortalLauncher-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PortalLauncher-portable
          path: PortalLauncher-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PortalLauncher-installer
          path: build/compose/binaries/main/exe/*.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PortalLauncher-portable.zip
            build/compose/binaries/main/exe/*.exe

  server:
    name: Backend package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        if: runner.os != 'Windows'
        run: chmod +x gradlew
      - run: ./gradlew :server:installDist --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: portal-server
          path: server/build/install/server
