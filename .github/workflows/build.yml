name: Build Portal Launcher

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        if: runner.os != 'Windows'
        run: chmod +x gradlew
      - name: Run tests (launcher + server)
        run: ./gradlew test --stacktrace

  windows:
    name: Windows EXE
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        if: runner.os != 'Windows'
        run: chmod +x gradlew
      - name: Build app-image (PortalLauncher.exe) and installer
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            ./gradlew createDistributable packageExe --stacktrace
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "Попытка $i не удалась, повтор через 20 секунд"
            Start-Sleep -Seconds 20
          }
          exit $LASTEXITCODE
      - name: Zip portable build
        shell: pwsh
        run: |
          Compress-Archive -Path build/compose/binaries/main/app/PortalLauncher -DestinationPath PortalLauncher-portable.zip
      - name: Build Setup.exe with folder choice (Inno Setup)
        shell: pwsh
        continue-on-error: true
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "Inno Setup не найден" }
          $v = (Select-String -Path gradle.properties -Pattern '^portal.version=(.+)$').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$v" packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC завершился с кодом $LASTEXITCODE" }
      - uses: actions/upload-artifact@v4
        with:
          name: PortalLauncher-Setup
          path: build/setup/PortalLauncher-Setup.exe
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: PortalLauncher-portable
          path: PortalLauncher-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PortalLauncher-installer
          path: build/compose/binaries/main/exe/*.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PortalLauncher-portable.zip
            build/setup/PortalLauncher-Setup.exe
            build/compose/binaries/main/exe/*.exe

  server:
    name: Backend package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        if: runner.os != 'Windows'
        run: chmod +x gradlew
      - run: ./gradlew :server:installDist --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: portal-server
          path: server/build/install/server
